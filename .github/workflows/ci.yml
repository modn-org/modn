name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Rehash main contract v2 self-test (Linux)
        if: runner.os == 'Linux'
        run: python3 .github/scripts/test_rehash_main.py
        env:
          MODN_BIN: target/debug/modn
      - name: Print the Node version that runs the UI behaviour tests
        run: cargo test -p modn-desktop --locked --test ui_node -- --nocapture
      - name: Verify desktop backend contracts (Windows)
        if: runner.os == 'Windows'
        run: cargo test -p modn-desktop --all-features --locked
      - name: Check documented script commands
        if: runner.os == 'Linux'
        run: python3 .github/scripts/check-doc-commands.py
      - name: Verify game-agnostic CLI (Linux)
        if: runner.os == 'Linux'
        run: python3 .agents/skills/verify-modn/scripts/verify.py --build
      - name: Verify game-agnostic CLI (Windows)
        if: runner.os == 'Windows'
        run: python .agents/skills/verify-modn/scripts/verify.py --build
