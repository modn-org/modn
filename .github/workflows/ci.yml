name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Verify game-agnostic CLI (Linux)
        if: runner.os == 'Linux'
        run: python3 .agents/skills/verify-modn/scripts/verify.py --build
      - name: Verify game-agnostic CLI (Windows)
        if: runner.os == 'Windows'
        run: python .agents/skills/verify-modn/scripts/verify.py --build
