name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/scripts/release-smoke.ps1
      - .github/scripts/install-smoke.ps1
      - install.ps1
      - .github/scripts/pack-main-bucket.py
      - buckets/main/**

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the tag matches the modn-cli version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq 'modn-cli').version
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match modn-cli version v$version"
          }
      - name: Build modn.exe with a static C runtime
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked -p modn-cli
      - name: Package modn.exe and its SHA-256 checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item target/release/modn.exe dist/modn.exe
          $hash = (Get-FileHash dist/modn.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$PWD/dist/modn.exe.sha256", "$hash *modn.exe`n")
          Get-Content dist/modn.exe.sha256
      - name: Package the deterministic main bucket and checksum
        run: python .github/scripts/pack-main-bucket.py buckets/main dist/main-bucket.zip
      - name: Package the installer
        run: Copy-Item install.ps1 dist/install.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: modn-windows-x64
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: release-smoke
          path: .github/scripts/release-smoke.ps1
          if-no-files-found: error

  smoke:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Smoke-test the installer
        run: pwsh -NoProfile -File .github/scripts/install-smoke.ps1
      - uses: actions/download-artifact@v4
        with:
          name: modn-windows-x64
          path: ${{ runner.temp }}/dist
      - uses: actions/download-artifact@v4
        with:
          name: release-smoke
          path: ${{ runner.temp }}/smoke
      - name: Smoke-test modn.exe without a repository or Rust toolchain
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: >-
          ./smoke/release-smoke.ps1
          -Binary ./dist/modn.exe
          -Checksum ./dist/modn.exe.sha256
          -MainBucket ./dist/main-bucket.zip

  release:
    needs: smoke
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: modn-windows-x64
          path: dist
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/modn.exe dist/modn.exe.sha256 dist/main-bucket.zip dist/main-bucket.zip.sha256 dist/install.ps1 \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --title "modn $GITHUB_REF_NAME" "${prerelease[@]}"
