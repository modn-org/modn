name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/scripts/release-smoke.ps1
      - .github/scripts/install-smoke.ps1
      - install.ps1
      - buckets/main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the tag matches the modn-cli version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq 'modn-cli').version
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match modn-cli version v$version"
          }
      - name: Build modn.exe with a static C runtime
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --release --locked -p modn-cli -p modn-mcp -p modn-desktop --features modn-desktop/verification
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc -C opt-level=3 -C target-feature=+crt-static apps/modn-mcp/tests/fixtures/backend.rs -o target/release/modn-mcp-fault.exe
      - name: Package verifier binaries and SHA-256 checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path verifiers | Out-Null
          foreach ($name in @('modn-mcp.exe', 'modn-mcp-fault.exe', 'modn-desktop.exe', 'modn-desktop-test-backend.exe')) {
            Copy-Item "target/release/$name" "verifiers/$name"
            $hash = (Get-FileHash "verifiers/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            [IO.File]::WriteAllText("$PWD/verifiers/$name.sha256", "$hash *$name`n")
          }
      - uses: actions/upload-artifact@v4
        with:
          name: modn-verifiers-${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          path: verifiers/
          retention-days: 30
          if-no-files-found: error
      - name: Package modn.exe and its SHA-256 checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item target/release/modn.exe dist/modn.exe
          $hash = (Get-FileHash dist/modn.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$PWD/dist/modn.exe.sha256", "$hash *modn.exe`n")
          Get-Content dist/modn.exe.sha256
      - name: Package the installer
        run: Copy-Item install.ps1 dist/install.ps1
      - name: Package the smoke test with a signed ephemeral main bucket
        shell: pwsh
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          python buckets/main/.github/scripts/pack.py buckets/main smoke/main-bucket.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bucket = Join-Path $env:RUNNER_TEMP 'smoke-bucket'
          Expand-Archive -LiteralPath smoke/main-bucket.zip -DestinationPath $bucket
          cargo run --quiet --locked -p modn-core --example sign_catalog -- $bucket smoke/main-bucket.zip.minisig smoke/main-bucket.pub
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # A separate test-key build for `bucket update`; never copied into dist/.
          cargo build --release --locked -p modn-cli --features modn-core/test-main-key --target-dir target/smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target/smoke/release/modn.exe smoke/modn-test.exe
          Copy-Item .github/scripts/release-smoke.ps1 smoke/release-smoke.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: modn-windows-x64
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: release-smoke
          path: smoke/
          if-no-files-found: error

  smoke:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Smoke-test the installer
        run: pwsh -NoProfile -File .github/scripts/install-smoke.ps1
      - uses: actions/download-artifact@v4
        with:
          name: modn-windows-x64
          path: ${{ runner.temp }}/dist
      - uses: actions/download-artifact@v4
        with:
          name: release-smoke
          path: ${{ runner.temp }}/smoke
      - name: Smoke-test modn.exe without a repository or Rust toolchain
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: >-
          ./smoke/release-smoke.ps1
          -Binary ./dist/modn.exe
          -Checksum ./dist/modn.exe.sha256
          -MainBucket ./smoke/main-bucket.zip
          -BucketBinary ./smoke/modn-test.exe
          -PublicKey ./smoke/main-bucket.pub

  release:
    needs: smoke
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: modn-windows-x64
          path: dist
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/modn.exe dist/modn.exe.sha256 dist/install.ps1 \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --title "modn $GITHUB_REF_NAME" "${prerelease[@]}"
