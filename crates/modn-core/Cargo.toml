[package]
name = "modn-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
test-checkver-endpoints = []
test-instruction-budget = []
test-main-bucket-releases = []
test-main-key = []

[dependencies]
anyhow = "1"
base64 = "0.23"
blake3 = "1"
minisign-verify = "0.3"
mlua = { version = "0.12", default-features = false, features = ["lua54", "vendored"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
sevenz-rust2 = { version = "0.24", default-features = false }
fs2 = "0.4"
lightningcss = { version = "=1.0.0-alpha.72", default-features = false }
same-file = "1"
tempfile = "3"
semver = "1"

[dev-dependencies]
minisign = "0.10"
proptest = { version = "1", default-features = false, features = ["std"] }
tempfile = "3"
sevenz-rust2 = { version = "0.24", default-features = false, features = ["compress"] }

[target.'cfg(windows)'.dependencies]
winapi-util = "0.1"
windows-registry = "0.6"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }
