[package]
name = "modn-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints.rust]
# `deny` rather than the workspace `forbid`: the Windows job-object and
# Toolhelp bindings in `acquisition/git/tree/windows.rs` need FFI. That module
# opts in with `#![expect(unsafe_code, ...)]`; every other module stays safe.
unsafe_code = "deny"
unstable_features = "deny"

[lints.clippy]
ref_option = "deny"
disallowed_methods = "deny"
unwrap_used = "deny"
wildcard_imports = "deny"
needless_for_each = "deny"
undocumented_unsafe_blocks = "deny"
derive_partial_eq_without_eq = "allow"
missing_const_for_fn = "allow"

[features]
test-checkver-endpoints = []
test-instruction-budget = []
test-known-source-redirect = []
test-main-bucket-releases = []
test-main-key = []

[dependencies]
anyhow = "1"
base64 = "0.23"
blake3 = "1"
minisign-verify = "0.3"
mlua = { version = "0.12", default-features = false, features = ["lua54", "vendored"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
sevenz-rust2 = { version = "0.24", default-features = false }
fs2 = "0.4"
lightningcss = { version = "=1.0.0-alpha.72", default-features = false }
same-file = "1"
tempfile = "3"
semver = "1"

[dev-dependencies]
minisign = "0.10"
proptest = { version = "1", default-features = false, features = ["std"] }
tempfile = "3"
sevenz-rust2 = { version = "0.24", default-features = false, features = ["compress"] }

[target.'cfg(windows)'.dependencies]
winapi-util = "0.1"
windows-registry = "0.6"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs", "process"] }
