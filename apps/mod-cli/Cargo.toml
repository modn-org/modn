[package]
name = "mod-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "mod"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
mod-core = { path = "../../crates/mod-core" }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
zip = { version = "2.4", default-features = false }
