[package]
name = "modn-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "modn"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
modn-core = { path = "../../crates/modn-core" }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
zip = { version = "2.4", default-features = false }
