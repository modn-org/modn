[package]
name = "modn-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "modn"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.23"
blake3 = "1"
clap = { version = "4.5", features = ["derive"] }
ctrlc = { version = "3.5", features = ["termination"] }
keyring = { version = "4.2", default-features = false, features = ["v1", "windows-native-keyring-store"] }
minisign = "0.10"
modn-core = { path = "../../crates/modn-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
tempfile = "3"
ureq = "3"

[dev-dependencies]
modn-core = { path = "../../crates/modn-core", features = ["test-checkver-endpoints", "test-instruction-budget", "test-known-source-redirect", "test-main-bucket-releases", "test-main-key"] }
proptest = { version = "1", default-features = false, features = ["std"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sevenz-rust2 = { version = "0.24", default-features = false, features = ["compress"] }
same-file = "1"
zip = { version = "2.4", default-features = false }
