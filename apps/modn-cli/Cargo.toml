[package]
name = "modn-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "modn"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
keyring = { version = "4.2", default-features = false, features = ["v1", "windows-native-keyring-store"] }
modn-core = { path = "../../crates/modn-core" }
serde_json = "1"
ureq = "3"

[dev-dependencies]
blake3 = "1"
modn-core = { path = "../../crates/modn-core", features = ["test-instruction-budget", "test-main-key"] }
minisign = "0.10"
proptest = { version = "1", default-features = false, features = ["std"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
sevenz-rust2 = { version = "0.24", default-features = false, features = ["compress"] }
same-file = "1"
tempfile = "3"
zip = { version = "2.4", default-features = false }
