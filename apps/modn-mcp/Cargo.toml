[package]
name = "modn-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "io-util", "io-std", "process", "time", "sync"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
